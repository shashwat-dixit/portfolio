# Required repository secrets (Settings → Secrets and variables → Actions):
#   SSH_PRIVATE_KEY  — private key whose public half is on the EC2 host
#   SSH_KNOWN_HOSTS  — output of `ssh-keyscan -H <host>`
#   DEPLOY_USER      — SSH user on the EC2 host
#   DEPLOY_HOST      — EC2 hostname or IP
#   SYNC_API_KEY     — same value as the server's SYNC_API_KEY
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Tuesday 9:00 AM IST / 3:30 AM UTC — weekly blog content sync
    - cron: "30 3 * * 2"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-backend:
    name: Test backend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...

  test-frontend:
    name: Test frontend
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild esbuild
      - run: pnpm build
        env:
          PUBLIC_API_URL: https://api.shashwatdixit.com

  deploy:
    name: Deploy production
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://shashwatdixit.com
    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Set the SSH_PRIVATE_KEY repository secret}"
          : "${SSH_KNOWN_HOSTS:?Set the SSH_KNOWN_HOSTS repository secret}"
          : "${DEPLOY_USER:?Set the DEPLOY_USER repository secret}"
          : "${DEPLOY_HOST:?Set the DEPLOY_HOST repository secret}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          eval "$(ssh-agent -s)"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh -o StrictHostKeyChecking=yes "$DEPLOY_USER@$DEPLOY_HOST" bash -s << 'EOF'
          set -euo pipefail
          cd ~/portfolio
          git fetch https://github.com/shashwat-dixit/portfolio.git main
          git merge --ff-only FETCH_HEAD
          docker compose pull
          docker compose up -d --build --remove-orphans
          docker image prune -f
          EOF
      - name: Verify API health
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sf https://api.shashwatdixit.com/api/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for API (attempt ${i})..."
            sleep 5
          done
          echo "Health check failed"
          exit 1

  sync:
    name: Sync blog content
    needs: [deploy]
    if: |
      always() &&
      !cancelled() &&
      (
        github.event_name == 'schedule' ||
        needs.deploy.result == 'success'
      )
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Trigger POST /api/sync
        env:
          SYNC_API_KEY: ${{ secrets.SYNC_API_KEY }}
        run: |
          set -euo pipefail
          : "${SYNC_API_KEY:?Set the SYNC_API_KEY repository secret}"
          curl -sf -X POST \
            -H "X-API-Key: ${SYNC_API_KEY}" \
            "https://api.shashwatdixit.com/api/sync"
